<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3a1f4d">
<title>قفزة الجمل | Camel Jump</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="authOverlay" class="auth-overlay" hidden>
  <div class="auth-card">
    <h1>قفزة الجمل</h1>
    <p class="auth-sub">Camel Jump</p>
    <input id="authUsername" class="auth-input" type="text" placeholder="Username · اسم المستخدم" autocomplete="username" maxlength="20">
    <input id="authEmail" class="auth-input" type="email" placeholder="Email (for sign up only) · البريد الإلكتروني" autocomplete="email" maxlength="100">
    <input id="authPassword" class="auth-input" type="password" placeholder="Password · كلمة المرور" autocomplete="current-password" maxlength="64">
    <div id="authError" class="auth-error"></div>
    <button id="authLoginBtn" class="auth-btn auth-btn-primary" type="button">Log In</button>
    <button id="authSignupBtn" class="auth-btn" type="button">Sign Up</button>
    <button id="authForgotBtn" class="auth-link" type="button">Forgot password?</button>
    <button id="authGuestBtn" class="auth-link" type="button">Continue as guest</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script src="game.js"></script>
</body>
</html>
